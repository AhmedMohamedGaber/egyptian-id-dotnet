name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore package icon
        run: base64 -d assets/icon.base64 > assets/icon.png
      - run: dotnet test tests/EgyptianId.Tests/EgyptianId.Tests.csproj --configuration Release
      - run: dotnet pack src/EgyptianId/EgyptianId.csproj --configuration Release --output artifacts
