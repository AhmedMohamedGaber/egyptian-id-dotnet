name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub issue the OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore package icon
        run: base64 -d assets/icon.base64 > assets/icon.png

      - name: Test
        run: dotnet test EgyptianId.sln --configuration Release

      - name: Pack (versions come from each csproj)
        run: dotnet pack EgyptianId.sln --configuration Release --output artifacts

      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: gaberx

      - name: NuGet push
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
